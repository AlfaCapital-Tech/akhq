name: Tests

on:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Run akhq tests
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Run ./gradlew check
        run: ./gradlew check --no-daemon

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'

      - name: Cleanup orphan processes & temp state
        if: always()
        run: |
          pkill -9 -f 'org.akhq.KafkaTestCluster' || true
          ./gradlew --stop || true
          rm -f /tmp/akhq-cs.json || true
          rm -rf /tmp/kafka-* /tmp/junit-* /tmp/akhq-* || true
